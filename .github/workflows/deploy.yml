name: Deploy

on:
  push:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: nextjs-${{ hashFiles('package-lock.json') }}-

      - run: npm test

      - run: NEXT_PUBLIC_COMMIT_SHA=${{ github.sha }} npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOST }}" >> ~/.ssh/known_hosts
          printf 'Host deploy\n  HostName %s\n  User ec2-user\n  IdentityFile ~/.ssh/deploy_key\n' \
            "${{ secrets.SSH_HOST }}" >> ~/.ssh/config

      - name: Deploy
        env:
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
        run: |
          rsync -avz --exclude=intel.db .next/standalone/ deploy:~/utopiaintel/
          rsync -avz .next/static/ deploy:~/utopiaintel/.next/static/
          scp ecosystem.config.js deploy:~/utopiaintel/
          ssh deploy "AXIOM_TOKEN='${AXIOM_TOKEN}' AXIOM_DATASET='utopiaintel' pm2 reload ~/utopiaintel/ecosystem.config.js"
